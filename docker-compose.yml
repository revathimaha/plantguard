services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: plantguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - plantguard-qdrant:/qdrant/storage
    restart: unless-stopped

  plantguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantguard-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - plantguard-data:/app/data
      - plantguard-runtime:/app/runtime
    restart: unless-stopped

volumes:
  plantguard-data:
  plantguard-runtime:
  plantguard-qdrant:
