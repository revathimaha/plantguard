[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[project]
name = "capstone-data-toolkit"
version = "0.1.0"


description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "reportlab>=4.0",
    "faker>=25.0",
    "litellm>=1.0",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "fastapi",
    "uvicorn[standard]",
    "fastmcp",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-google-genai",
    "langfuse",
    "qdrant-client",
    "sentence-transformers",
]
